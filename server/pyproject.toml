[project]
name = "usage-server"
version = "0.1.2"
description = "Usage tracking and estimated cost for CLIProxyAPI"
requires-python = ">=3.15"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["usage_server"]

[tool.hatch.build.targets.wheel.force-include]
"usage_server/ui/index.html" = "usage_server/ui/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
